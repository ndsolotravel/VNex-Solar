services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vnex_solar}
      POSTGRES_USER: ${POSTGRES_USER:-vnex_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - vnex_pgdata:/var/lib/postgresql/data
    networks:
      - vnex_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vnex_app} -d ${POSTGRES_DB:-vnex_solar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - vnex_minio_data:/data
    networks:
      - vnex_private

networks:
  vnex_private:
    driver: bridge
    internal: true

volumes:
  vnex_pgdata:
  vnex_minio_data:
